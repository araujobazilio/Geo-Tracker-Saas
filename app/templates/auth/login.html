{% extends "auth_base.html" %}
{% block title %}Sign in — GEO Tracker{% endblock %}
{% block content %}
<div class="card">
  <h2 class="card-title">Sign in</h2>
  {% if error %}
  <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login{% if request.query_params.get('next') %}?next={{ request.query_params.get('next') }}{% endif %}" class="mt-6 space-y-4">
    <div>
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required
             class="form-input" autocomplete="email" autofocus>
    </div>
    <div>
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" required
             class="form-input" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary w-full">Sign in</button>
  </form>
  <p class="mt-6 text-center text-sm text-gray-600">
    Don't have an account? <a href="/register" class="link">Create one</a>
  </p>
</div>
{% endblock %}
