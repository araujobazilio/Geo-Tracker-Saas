# =============================================================================
# GEO Tracker — Nginx reverse proxy configuration (production)
# =============================================================================
# Responsibilities:
#   - TLS termination
#   - HTTP → HTTPS redirect
#   - Proxy to app (uvicorn)
#   - Forward Host, X-Forwarded-For, X-Forwarded-Proto
#   - Static asset serving with bounded cache
#   - Security headers (supplements app middleware)
#   - Reasonable client/body limits and timeouts
# =============================================================================

# Rate limiting zone for auth endpoints.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

upstream geo_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # TLS certificates — mount via docker-compose volumes.
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client body limits.
    client_max_body_size 10m;

    # Timeouts.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Security headers (supplements app-level middleware).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Static assets — served directly by Nginx with bounded cache.
    # Filenames are NOT content-hashed, so use a moderate cache.
    location /static/ {
        proxy_pass http://geo_app;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    # Auth endpoints — rate limited.
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://geo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # All other requests — proxy to app.
    location / {
        proxy_pass http://geo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite X-Forwarded-For with the real client IP only.
        # Do NOT append to an existing chain from the public internet.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Health endpoints — no caching.
    location = /health {
        proxy_pass http://geo_app;
        add_header Cache-Control "no-cache";
    }
    location = /ready {
        proxy_pass http://geo_app;
        add_header Cache-Control "no-cache";
    }
}
