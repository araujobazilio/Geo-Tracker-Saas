name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: geo_tracker
          POSTGRES_PASSWORD: geo_tracker_dev_password
          POSTGRES_DB: geo_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_tracker -d geo_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-test-secret-not-for-production-use-1234567890
      TEST_DATABASE_URL: postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test
      # DATABASE_URL is set to the same test DB so standalone Alembic CLI
      # steps (upgrade / check) target the test database, not the dev DB.
      DATABASE_URL: postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test
      REDIS_URL: redis://localhost:6379/0
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts"

      - name: Create test database
        run: |
          PGPASSWORD=geo_tracker_dev_password psql -h localhost -U geo_tracker -d geo_tracker -c "CREATE DATABASE geo_tracker_test;"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Verify generated asset is current
        run: git diff --exit-code -- app/static/css/app.css

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: Verify static assets exist
        run: |
          test -f app/static/css/app.css
          test -f app/static/js/app.js
          test -f app/static/vendor/htmx.min.js
          test -f app/static/vendor/chart.umd.min.js

      - name: Verify templates exist
        run: |
          test -f app/templates/base.html
          test -f app/templates/auth_base.html
          test -f app/templates/app_base.html
          test -f app/templates/auth/login.html
          test -f app/templates/auth/register.html
          test -f app/templates/dashboard/workspace.html
          test -f app/templates/dashboard/no_workspace.html
          test -f app/templates/projects/dashboard.html
          test -f app/templates/projects/onboarding.html
          test -f app/templates/scans/detail.html
          test -f app/templates/partials/scan_status.html
          test -f app/templates/opportunities/list.html
          test -f app/templates/opportunities/detail.html
          test -f app/templates/notifications/list.html
          test -f app/templates/settings/notifications.html
          test -f app/templates/errors/404.html
          test -f app/templates/errors/403.html
          test -f app/templates/errors/500.html
          test -f app/templates/errors/4xx.html
          test -f app/templates/projects/settings.html

      - name: Verify web app starts (semantic route check)
        run: |
          python -c "
          from app.main import create_app
          app = create_app()
          paths = {r.path for r in app.routes if hasattr(r, 'path')}
          required = [
              '/',
              '/login',
              '/register',
              '/logout',
              '/app',
              '/app/w/{workspace_id}',
              '/app/w/{workspace_id}/projects/new',
              '/app/w/{workspace_id}/projects/{project_id}',
              '/app/w/{workspace_id}/projects/{project_id}/scans',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}/status',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}/confidence',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}/transition',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}/verify',
              '/app/w/{workspace_id}/projects/{project_id}/schedule/enable',
              '/app/w/{workspace_id}/projects/{project_id}/schedule/disable',
              '/app/w/{workspace_id}/projects/{project_id}/settings',
              '/app/w/{workspace_id}/projects/{project_id}/settings/brand',
              '/app/w/{workspace_id}/projects/{project_id}/prompts/regenerate',
              '/app/w/{workspace_id}/notifications',
              '/app/w/{workspace_id}/notifications/{notification_id}/read',
              '/app/w/{workspace_id}/notifications/mark-all-read',
              '/app/w/{workspace_id}/settings/notifications',
              '/health',
              '/api/v1/auth/register',
              '/api/v1/auth/login',
              '/api/v1/auth/logout',
          ]
          missing = [p for p in required if p not in paths]
          assert not missing, f'Missing required routes: {missing}'
          print(f'All {len(required)} required routes verified')
          "

      - name: Alembic migration to head
        run: alembic upgrade head

      - name: Alembic downgrade one revision
        run: alembic downgrade -1

      - name: Alembic re-upgrade to head
        run: alembic upgrade head

      - name: Alembic drift check
        run: alembic check

      - name: pytest
        run: pytest -v
