name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: geo_tracker
          POSTGRES_PASSWORD: geo_tracker_dev_password
          POSTGRES_DB: geo_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_tracker -d geo_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-test-secret-not-for-production-use-1234567890
      TEST_DATABASE_URL: postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test
      # DATABASE_URL is set to the same test DB so standalone Alembic CLI
      # steps (upgrade / check) target the test database, not the dev DB.
      DATABASE_URL: postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test
      REDIS_URL: redis://localhost:6379/0
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create test database
        run: |
          PGPASSWORD=geo_tracker_dev_password psql -h localhost -U geo_tracker -d geo_tracker -c "CREATE DATABASE geo_tracker_test;"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Verify generated asset is current
        run: git diff --exit-code -- app/static/css/app.css

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: Verify static assets exist
        run: |
          test -f app/static/css/app.css
          test -f app/static/js/app.js
          test -f app/static/vendor/htmx.min.js
          test -f app/static/vendor/chart.umd.min.js

      - name: Verify templates exist
        run: |
          test -f app/templates/base.html
          test -f app/templates/auth_base.html
          test -f app/templates/app_base.html
          test -f app/templates/auth/login.html
          test -f app/templates/auth/register.html
          test -f app/templates/dashboard/workspace.html
          test -f app/templates/dashboard/no_workspace.html
          test -f app/templates/projects/dashboard.html
          test -f app/templates/projects/onboarding.html
          test -f app/templates/scans/detail.html
          test -f app/templates/partials/scan_status.html
          test -f app/templates/opportunities/list.html
          test -f app/templates/opportunities/detail.html
          test -f app/templates/notifications/list.html
          test -f app/templates/settings/notifications.html
          test -f app/templates/errors/404.html
          test -f app/templates/errors/403.html
          test -f app/templates/errors/500.html
          test -f app/templates/errors/4xx.html
          test -f app/templates/projects/settings.html
          test -f app/templates/auth/register_closed.html
          test -f app/templates/settings/plan.html
          test -f app/middleware/__init__.py
          test -f app/middleware/correlation.py
          test -f app/middleware/security_headers.py
          test -f app/middleware/trusted_host.py
          test -f app/middleware/request_logging.py
          test -f docker-compose.prod.yml
          test -f docker/nginx/nginx.conf
          test -f .env.production.example
          test -f scripts/check_production_config.py
          test -f scripts/backup_postgres.sh
          test -f scripts/smoke_test.sh
          test -f scripts/provision_beta_user.py
          test -f scripts/seed_plans.py
          test -f docs/DEPLOYMENT.md
          test -f docs/OPERATIONS.md
          test -f docs/BACKUP_AND_RESTORE.md

      - name: Verify web app starts (semantic route check)
        run: |
          python -c "
          from app.main import create_app
          app = create_app()
          paths = {r.path for r in app.routes if hasattr(r, 'path')}
          required = [
              '/',
              '/login',
              '/register',
              '/logout',
              '/app',
              '/app/w/{workspace_id}',
              '/app/w/{workspace_id}/projects/new',
              '/app/w/{workspace_id}/projects/{project_id}',
              '/app/w/{workspace_id}/projects/{project_id}/scans',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}/status',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}/confidence',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}/transition',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}/verify',
              '/app/w/{workspace_id}/projects/{project_id}/schedule/enable',
              '/app/w/{workspace_id}/projects/{project_id}/schedule/disable',
              '/app/w/{workspace_id}/projects/{project_id}/settings',
              '/app/w/{workspace_id}/projects/{project_id}/settings/brand',
              '/app/w/{workspace_id}/projects/{project_id}/settings/topics/add',
              '/app/w/{workspace_id}/projects/{project_id}/settings/topics/{keyword_id}/remove',
              '/app/w/{workspace_id}/projects/{project_id}/settings/competitors/add',
              '/app/w/{workspace_id}/projects/{project_id}/settings/competitors/{competitor_id}/remove',
              '/app/w/{workspace_id}/projects/{project_id}/settings/providers',
              '/app/w/{workspace_id}/projects/{project_id}/prompts/regenerate',
              '/app/w/{workspace_id}/notifications',
              '/app/w/{workspace_id}/notifications/{notification_id}/read',
              '/app/w/{workspace_id}/notifications/mark-all-read',
              '/app/w/{workspace_id}/settings/notifications',
              '/app/w/{workspace_id}/settings/plan',
              '/health',
              '/api/v1/auth/register',
              '/api/v1/auth/login',
              '/api/v1/auth/logout',
          ]
          missing = [p for p in required if p not in paths]
          assert not missing, f'Missing required routes: {missing}'
          print(f'All {len(required)} required routes verified')
          "

      - name: Alembic migration to head
        run: alembic upgrade head

      - name: Alembic downgrade one revision
        run: alembic downgrade -1

      - name: Alembic re-upgrade to head
        run: alembic upgrade head

      - name: Alembic drift check
        run: alembic check

      - name: pytest
        run: pytest -v

      # ====================================================================
      # Production Docker / Compose / Nginx gates
      # ====================================================================

      - name: Validate production compose config
        env:
          DATABASE_USER: geo_tracker
          DATABASE_PASSWORD: ci-dummy-password
          DATABASE_NAME: geo_tracker
          GIT_SHA: ${{ github.sha }}
          FORWARDED_ALLOW_IPS: 172.16.0.0/12
        run: |
          docker compose -f docker-compose.prod.yml config -q

      - name: Verify production compose has no public DB/Redis ports
        run: |
          python -c "
          import yaml, sys
          with open('docker-compose.prod.yml') as f:
              data = yaml.safe_load(f)
          services = data.get('services', {})
          for svc_name in ['postgres', 'redis', 'app']:
              ports = services.get(svc_name, {}).get('ports', [])
              if ports:
                  print(f'FAIL: {svc_name} has public ports: {ports}')
                  sys.exit(1)
          nginx_ports = services.get('nginx', {}).get('ports', [])
          port_strs = [str(p) for p in nginx_ports]
          assert any('80' in p for p in port_strs), 'Nginx must publish 80'
          assert any('443' in p for p in port_strs), 'Nginx must publish 443'
          print('OK: production compose port configuration valid')
          "

      - name: Build production Docker image
        run: |
          docker build \
            --tag geo-tracker-ci:${{ github.sha }} \
            .

      - name: Inspect production image (non-root runtime)
        run: |
          # Verify the runtime user is NOT root (uid 0).
          RUNTIME_UID=$(docker run --rm geo-tracker-ci:${{ github.sha }} id -u)
          echo "Runtime UID: $RUNTIME_UID"
          if [ "$RUNTIME_UID" = "0" ]; then
            echo "FAIL: production image runs as root (uid 0)"
            exit 1
          fi
          echo "OK: production image runs as non-root (uid $RUNTIME_UID)"

      - name: Verify runtime image has no dev tooling
        run: |
          # Verify pytest, ruff, mypy, ipython are NOT installed in the runtime image.
          for tool in pytest ruff mypy ipython; do
            if docker run --rm geo-tracker-ci:${{ github.sha }} which $tool 2>/dev/null; then
              echo "FAIL: $tool is present in the production runtime image"
              exit 1
            fi
            echo "OK: $tool not found in runtime image"
          done

      - name: Verify /app/.env does not exist in image
        run: |
          if docker run --rm geo-tracker-ci:${{ github.sha }} test -f /app/.env 2>/dev/null; then
            echo "FAIL: /app/.env exists in production image"
            exit 1
          fi
          echo "OK: /app/.env not found in production image"

      - name: Production image health smoke
        run: |
          # Run the production image and verify /health responds.
          docker run --rm -d --name geo-tracker-smoke -p 18001:8000 \
            -e APP_ENV=test \
            -e APP_SECRET_KEY=ci-smoke-test-secret-not-for-production-use \
            -e DATABASE_URL=postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LOG_JSON=false \
            geo-tracker-ci:${{ github.sha }}
          sleep 5
          # /health should return 200 (zero-dependency endpoint).
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18001/health || echo "000")
          echo "Health status: $STATUS"
          docker stop geo-tracker-smoke 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /health did not return 200"
            exit 1
          fi
          echo "OK: /health returned 200"

      - name: Validate Nginx config syntax
        run: |
          # Create temporary dummy cert files for syntax validation.
          mkdir -p /tmp/nginx-tls
          openssl req -x509 -nodes -days 1 \
            -newkey rsa:2048 \
            -keyout /tmp/nginx-tls/dummy.key \
            -out /tmp/nginx-tls/dummy.crt \
            -subj "/CN=localhost" 2>/dev/null
          # Validate nginx config by mounting it into the nginx image.
          docker run --rm \
            -v $(pwd)/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/nginx-tls:/etc/nginx/tls:ro \
            nginx:1.27-alpine nginx -t
