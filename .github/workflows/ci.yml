name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: geo_tracker
          POSTGRES_PASSWORD: geo_tracker_dev_password
          POSTGRES_DB: geo_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_tracker -d geo_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-test-secret-not-for-production-use-1234567890
      TEST_DATABASE_URL: postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test
      # DATABASE_URL is set to the same test DB so standalone Alembic CLI
      # steps (upgrade / check) target the test database, not the dev DB.
      DATABASE_URL: postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test
      REDIS_URL: redis://localhost:6379/0
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create test database
        run: |
          PGPASSWORD=geo_tracker_dev_password psql -h localhost -U geo_tracker -d geo_tracker -c "CREATE DATABASE geo_tracker_test;"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Verify generated asset is current
        run: git diff --exit-code -- app/static/css/app.css

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: Verify static assets exist
        run: |
          test -f app/static/css/app.css
          test -f app/static/js/app.js
          test -f app/static/vendor/htmx.min.js
          test -f app/static/vendor/chart.umd.min.js

      - name: Verify templates exist
        run: |
          test -f app/templates/base.html
          test -f app/templates/auth_base.html
          test -f app/templates/app_base.html
          test -f app/templates/auth/login.html
          test -f app/templates/auth/register.html
          test -f app/templates/dashboard/workspace.html
          test -f app/templates/dashboard/no_workspace.html
          test -f app/templates/projects/dashboard.html
          test -f app/templates/projects/onboarding.html
          test -f app/templates/scans/detail.html
          test -f app/templates/partials/scan_status.html
          test -f app/templates/opportunities/list.html
          test -f app/templates/opportunities/detail.html
          test -f app/templates/notifications/list.html
          test -f app/templates/settings/notifications.html
          test -f app/templates/errors/404.html
          test -f app/templates/errors/403.html
          test -f app/templates/errors/500.html
          test -f app/templates/errors/4xx.html
          test -f app/templates/projects/settings.html
          test -f app/templates/auth/register_closed.html
          test -f app/templates/settings/plan.html
          test -f app/middleware/__init__.py
          test -f app/middleware/correlation.py
          test -f app/middleware/security_headers.py
          test -f app/middleware/trusted_host.py
          test -f app/middleware/request_logging.py
          test -f docker-compose.prod.yml
          test -f docker/nginx/nginx.conf
          test -f .env.production.example
          test -f scripts/check_production_config.py
          test -f scripts/backup_postgres.sh
          test -f scripts/smoke_test.sh
          test -f scripts/provision_beta_user.py
          test -f scripts/seed_plans.py
          test -f docs/DEPLOYMENT.md
          test -f docs/OPERATIONS.md
          test -f docs/BACKUP_AND_RESTORE.md

      - name: Verify web app starts (semantic route check)
        run: |
          python -c "
          from app.main import create_app
          app = create_app()
          paths = {r.path for r in app.routes if hasattr(r, 'path')}
          required = [
              '/',
              '/login',
              '/register',
              '/logout',
              '/app',
              '/app/w/{workspace_id}',
              '/app/w/{workspace_id}/projects/new',
              '/app/w/{workspace_id}/projects/{project_id}',
              '/app/w/{workspace_id}/projects/{project_id}/scans',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}/status',
              '/app/w/{workspace_id}/projects/{project_id}/scans/{scan_id}/confidence',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}/transition',
              '/app/w/{workspace_id}/projects/{project_id}/opportunities/{opportunity_id}/verify',
              '/app/w/{workspace_id}/projects/{project_id}/schedule/enable',
              '/app/w/{workspace_id}/projects/{project_id}/schedule/disable',
              '/app/w/{workspace_id}/projects/{project_id}/settings',
              '/app/w/{workspace_id}/projects/{project_id}/settings/brand',
              '/app/w/{workspace_id}/projects/{project_id}/settings/topics/add',
              '/app/w/{workspace_id}/projects/{project_id}/settings/topics/{keyword_id}/remove',
              '/app/w/{workspace_id}/projects/{project_id}/settings/competitors/add',
              '/app/w/{workspace_id}/projects/{project_id}/settings/competitors/{competitor_id}/remove',
              '/app/w/{workspace_id}/projects/{project_id}/settings/providers',
              '/app/w/{workspace_id}/projects/{project_id}/prompts/regenerate',
              '/app/w/{workspace_id}/notifications',
              '/app/w/{workspace_id}/notifications/{notification_id}/read',
              '/app/w/{workspace_id}/notifications/mark-all-read',
              '/app/w/{workspace_id}/settings/notifications',
              '/app/w/{workspace_id}/settings/plan',
              '/health',
              '/api/v1/auth/register',
              '/api/v1/auth/login',
              '/api/v1/auth/logout',
          ]
          missing = [p for p in required if p not in paths]
          assert not missing, f'Missing required routes: {missing}'
          print(f'All {len(required)} required routes verified')
          "

      - name: Alembic migration to head
        run: alembic upgrade head

      - name: Alembic downgrade one revision
        run: alembic downgrade -1

      - name: Alembic re-upgrade to head
        run: alembic upgrade head

      - name: Alembic drift check
        run: alembic check

      - name: pytest
        run: pytest -v

      # ====================================================================
      # Production Docker / Compose / Nginx gates
      # ====================================================================

      - name: Validate production compose config
        env:
          DATABASE_USER: geo_tracker
          DATABASE_PASSWORD: ci-dummy-password
          DATABASE_NAME: geo_tracker
          GIT_SHA: ${{ github.sha }}
          FORWARDED_ALLOW_IPS: 172.16.0.0/12
        run: |
          # Create a dummy .env.production so docker compose can resolve env_file.
          cp .env.production.example .env.production
          # Replace placeholder secrets with safe CI values.
          sed -i 's|APP_SECRET_KEY=<generate-a-64+char-random-string>|APP_SECRET_KEY=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci|' .env.production
          sed -i 's|DATABASE_PASSWORD=<strong-production-password>|DATABASE_PASSWORD=ci-dummy-password|' .env.production
          sed -i 's|ALLOWED_HOSTS=your-domain.com,www.your-domain.com|ALLOWED_HOSTS=ci.example.test|' .env.production
          sed -i 's|APP_PUBLIC_BASE_URL=https://your-domain.com|APP_PUBLIC_BASE_URL=https://ci.example.test|' .env.production
          sed -i 's|GIT_SHA=|GIT_SHA=${{ github.sha }}|' .env.production
          docker compose -f docker-compose.prod.yml config -q
          rm -f .env.production

      - name: Compose env warning regression gate
        run: |
          # Verify that copying .env.production.example and replacing placeholders
          # does NOT produce unresolved-variable interpolation warnings.
          cp .env.production.example .env.production
          sed -i 's|APP_SECRET_KEY=<generate-a-64+char-random-string>|APP_SECRET_KEY=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci|' .env.production
          sed -i 's|DATABASE_PASSWORD=<strong-production-password>|DATABASE_PASSWORD=ci-dummy-password|' .env.production
          sed -i 's|ALLOWED_HOSTS=your-domain.com,www.your-domain.com|ALLOWED_HOSTS=ci.example.test|' .env.production
          sed -i 's|APP_PUBLIC_BASE_URL=https://your-domain.com|APP_PUBLIC_BASE_URL=https://ci.example.test|' .env.production
          sed -i 's|GIT_SHA=|GIT_SHA=${{ github.sha }}|' .env.production
          STDERR=$(docker compose --env-file .env.production -f docker-compose.prod.yml config -q 2>&1 >/dev/null)
          rm -f .env.production
          echo "Stderr: $STDERR"
          if echo "$STDERR" | grep -q "DATABASE_USER"; then
            echo "FAIL: unresolved DATABASE_USER warning in compose config"
            exit 1
          fi
          if echo "$STDERR" | grep -q "DATABASE_PASSWORD"; then
            echo "FAIL: unresolved DATABASE_PASSWORD warning in compose config"
            exit 1
          fi
          if echo "$STDERR" | grep -q "DATABASE_NAME"; then
            echo "FAIL: unresolved DATABASE_NAME warning in compose config"
            exit 1
          fi
          echo "OK: no unresolved-variable interpolation warnings"

      - name: Verify production compose has no public DB/Redis ports
        run: |
          python -c "
          import yaml, sys
          with open('docker-compose.prod.yml') as f:
              data = yaml.safe_load(f)
          services = data.get('services', {})
          for svc_name in ['postgres', 'redis', 'app']:
              ports = services.get(svc_name, {}).get('ports', [])
              if ports:
                  print(f'FAIL: {svc_name} has public ports: {ports}')
                  sys.exit(1)
          nginx_ports = services.get('nginx', {}).get('ports', [])
          port_strs = [str(p) for p in nginx_ports]
          assert any('80' in p for p in port_strs), 'Nginx must publish 80'
          assert any('443' in p for p in port_strs), 'Nginx must publish 443'
          print('OK: production compose port configuration valid')
          "

      - name: Build production Docker image
        run: |
          docker build \
            --tag geo-tracker-ci:${{ github.sha }} \
            .

      - name: Inspect production image (non-root runtime)
        run: |
          # Verify the runtime user is NOT root (uid 0).
          RUNTIME_UID=$(docker run --rm geo-tracker-ci:${{ github.sha }} id -u)
          echo "Runtime UID: $RUNTIME_UID"
          if [ "$RUNTIME_UID" = "0" ]; then
            echo "FAIL: production image runs as root (uid 0)"
            exit 1
          fi
          echo "OK: production image runs as non-root (uid $RUNTIME_UID)"

      - name: Verify runtime image has no dev tooling
        run: |
          # Verify pytest, ruff, mypy, ipython are NOT installed in the runtime image.
          for tool in pytest ruff mypy ipython; do
            if docker run --rm geo-tracker-ci:${{ github.sha }} which $tool 2>/dev/null; then
              echo "FAIL: $tool is present in the production runtime image"
              exit 1
            fi
            echo "OK: $tool not found in runtime image"
          done

      - name: Verify /app/.env does not exist in image
        run: |
          if docker run --rm geo-tracker-ci:${{ github.sha }} test -f /app/.env 2>/dev/null; then
            echo "FAIL: /app/.env exists in production image"
            exit 1
          fi
          echo "OK: /app/.env not found in production image"

      - name: Production image health smoke (test mode)
        run: |
          # Run the production image in test mode and verify /health responds.
          docker run --rm -d --name geo-tracker-smoke -p 18001:8000 \
            -e APP_ENV=test \
            -e APP_SECRET_KEY=ci-smoke-test-secret-not-for-production-use \
            -e DATABASE_URL=postgresql+psycopg://geo_tracker:geo_tracker_dev_password@localhost:5432/geo_tracker_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LOG_JSON=false \
            geo-tracker-ci:${{ github.sha }} \
            python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:18001/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded after ${i}s"
              break
            fi
            sleep 1
          done
          echo "Health status: $STATUS"
          docker stop geo-tracker-smoke 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /health did not return 200 within 30s"
            docker logs geo-tracker-smoke 2>/dev/null || true
            exit 1
          fi
          echo "OK: /health returned 200 (test mode)"

      - name: Production image health smoke (production mode)
        run: |
          # Run the production image in APP_ENV=production with real
          # TrustedHostMiddleware enforcement. Use the image's REAL
          # healthcheck (do not override CMD or HEALTHCHECK).
          docker run --rm -d --name geo-tracker-prod-smoke \
            -p 127.0.0.1:18002:8000 \
            -e APP_ENV=production \
            -e APP_SECRET_KEY=ci-prod-smoke-secret-not-for-production-use-1234567890 \
            -e ALLOWED_HOSTS=ci.example.test \
            -e APP_PUBLIC_BASE_URL=https://ci.example.test \
            -e DATABASE_URL=postgresql+psycopg://geo_tracker:ci-prod-db-password@localhost:5432/geo_tracker_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LOG_JSON=false \
            -e REGISTRATION_MODE=closed \
            -e SESSION_COOKIE_SECURE=true \
            -e DEV_SEED_ENABLED=false \
            -e EMAIL_ENABLED=false \
            geo-tracker-ci:${{ github.sha }}
          # Wait for Docker to report the container healthy (real healthcheck).
          # The Dockerfile healthcheck has --start-period=15s --interval=30s,
          # so allow up to 120s for the first successful probe.
          for i in $(seq 1 120); do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' geo-tracker-prod-smoke 2>/dev/null || echo "none")
            if [ "$HEALTH" = "healthy" ]; then
              echo "Container healthy after ${i}s"
              break
            fi
            if [ "$HEALTH" = "unhealthy" ]; then
              echo "Container unhealthy after ${i}s"
              break
            fi
            sleep 1
          done
          echo "Container health: $HEALTH"
          if [ "$HEALTH" != "healthy" ]; then
            echo "FAIL: container did not become healthy within 120s"
            echo "=== Container logs ==="
            docker logs geo-tracker-prod-smoke 2>&1 || true
            echo "=== Health check log ==="
            docker inspect --format='{{json .State.Health}}' geo-tracker-prod-smoke 2>/dev/null || true
            docker stop geo-tracker-prod-smoke 2>/dev/null || true
            exit 1
          fi
          # Verify authorized Host gets 200 on /health.
          STATUS_OK=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: ci.example.test" \
            http://127.0.0.1:18002/health 2>/dev/null || echo "000")
          echo "Authorized Host /health: $STATUS_OK"
          # Verify unauthorized Host gets 400 on /health.
          STATUS_BAD=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: malicious.example.test" \
            http://127.0.0.1:18002/health 2>/dev/null || echo "000")
          echo "Unauthorized Host /health: $STATUS_BAD"
          docker stop geo-tracker-prod-smoke 2>/dev/null || true
          if [ "$STATUS_OK" != "200" ]; then
            echo "FAIL: authorized Host did not get 200"
            exit 1
          fi
          if [ "$STATUS_BAD" != "400" ]; then
            echo "FAIL: unauthorized Host did not get 400"
            exit 1
          fi
          echo "OK: production-mode health smoke passed"

      - name: Validate Nginx config syntax
        run: |
          # Create temporary dummy cert files matching nginx.conf filenames.
          mkdir -p /tmp/nginx-tls
          openssl req -x509 -nodes -days 1 \
            -newkey rsa:2048 \
            -keyout /tmp/nginx-tls/privkey.pem \
            -out /tmp/nginx-tls/fullchain.pem \
            -subj "/CN=localhost" 2>/dev/null
          # Mount as conf.d/default.conf (same as docker-compose.prod.yml).
          # The nginx:alpine image includes /etc/nginx/conf.d/*.conf by default.
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v $(pwd)/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /tmp/nginx-tls:/etc/nginx/tls:ro \
            nginx:1.27-alpine nginx -t

      - name: Nginx runtime smoke (Host forwarding + health)
        run: |
          # Create a temporary isolated Docker network.
          docker network create geo-ci-nginx-test
          # Start the production app image on the network with alias "app".
          docker run --rm -d --name geo-ci-app \
            --network geo-ci-nginx-test \
            --network-alias app \
            -e APP_ENV=production \
            -e APP_SECRET_KEY=ci-nginx-smoke-secret-not-for-production-use-1234567 \
            -e ALLOWED_HOSTS=ci.example.test \
            -e APP_PUBLIC_BASE_URL=https://ci.example.test \
            -e DATABASE_URL=postgresql+psycopg://geo_tracker:ci-prod-db-password@localhost:5432/geo_tracker_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LOG_JSON=false \
            -e REGISTRATION_MODE=closed \
            -e SESSION_COOKIE_SECURE=true \
            -e DEV_SEED_ENABLED=false \
            -e EMAIL_ENABLED=false \
            geo-tracker-ci:${{ github.sha }}
          # Wait for app to be healthy (allow up to 120s for healthcheck).
          for i in $(seq 1 120); do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' geo-ci-app 2>/dev/null || echo "none")
            if [ "$HEALTH" = "healthy" ]; then
              echo "App healthy after ${i}s"
              break
            fi
            if [ "$HEALTH" = "unhealthy" ]; then
              echo "App unhealthy after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$HEALTH" != "healthy" ]; then
            echo "FAIL: app did not become healthy"
            docker logs geo-ci-app 2>/dev/null || true
            docker stop geo-ci-app 2>/dev/null || true
            docker network rm geo-ci-nginx-test 2>/dev/null || true
            exit 1
          fi
          # Start Nginx on the same network.
          docker run --rm -d --name geo-ci-nginx \
            --network geo-ci-nginx-test \
            -p 127.0.0.1:18003:443 \
            -p 127.0.0.1:18004:80 \
            -v $(pwd)/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /tmp/nginx-tls:/etc/nginx/tls:ro \
            nginx:1.27-alpine
          # Wait for Nginx container to become healthy (uses /nginx-health).
          for i in $(seq 1 30); do
            NGINX_CONTAINER_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' geo-ci-nginx 2>/dev/null || echo "none")
            if [ "$NGINX_CONTAINER_HEALTH" = "healthy" ]; then
              echo "Nginx healthy after ${i}s"
              break
            fi
            sleep 1
          done
          echo "Nginx container health: $NGINX_CONTAINER_HEALTH"
          # Verify Nginx /nginx-health from inside the container (restricted to 127.0.0.1).
          NGINX_HEALTH_INTERNAL=$(docker exec geo-ci-nginx wget -q -O - http://localhost/nginx-health 2>/dev/null || echo "FAIL")
          echo "Nginx /nginx-health (internal): $NGINX_HEALTH_INTERNAL"
          # Verify authorized Host through Nginx gets 200 on /health.
          HEALTH_OK=$(curl -sk -o /dev/null -w "%{http_code}" \
            -H "Host: ci.example.test" \
            https://127.0.0.1:18003/health 2>/dev/null || echo "000")
          echo "Authorized Host /health via Nginx: $HEALTH_OK"
          # Verify unauthorized Host through Nginx gets 400.
          HEALTH_BAD=$(curl -sk -o /dev/null -w "%{http_code}" \
            -H "Host: malicious.example.test" \
            https://127.0.0.1:18003/health 2>/dev/null || echo "000")
          echo "Unauthorized Host /health via Nginx: $HEALTH_BAD"
          # Cleanup.
          docker stop geo-ci-nginx geo-ci-app 2>/dev/null || true
          docker network rm geo-ci-nginx-test 2>/dev/null || true
          # Assertions.
          if [ "$NGINX_CONTAINER_HEALTH" != "healthy" ]; then
            echo "FAIL: Nginx container did not become healthy"
            exit 1
          fi
          if [ "$NGINX_HEALTH_INTERNAL" != "ok" ]; then
            echo "FAIL: Nginx /nginx-health internal probe did not return ok"
            exit 1
          fi
          if [ "$HEALTH_OK" != "200" ]; then
            echo "FAIL: authorized Host /health via Nginx did not return 200"
            exit 1
          fi
          if [ "$HEALTH_BAD" != "400" ]; then
            echo "FAIL: unauthorized Host /health via Nginx did not return 400"
            exit 1
          fi
          echo "OK: Nginx runtime smoke passed"
