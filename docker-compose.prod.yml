# =============================================================================
# GEO Tracker — Production Docker Compose stack
# =============================================================================
# Services: nginx, app, worker, beat, postgres, redis, migrate (one-shot)
# =============================================================================
# Release sequence (see docs/DEPLOYMENT.md for full runbook):
#   1. Build/pull exact SHA image
#   2. Backup database (scripts/backup_postgres.sh)
#   3. Run migration (one-shot, BEFORE app rollout):
#        docker compose -f docker-compose.prod.yml run --rm migrate
#   4. Start/update services:
#        docker compose -f docker-compose.prod.yml up -d
#   5. Readiness check: curl https://<host>/ready
#   6. Worker check: docker compose exec worker celery inspect ping
#   7. Smoke test: scripts/smoke_test.sh
# =============================================================================
# IMPORTANT: PostgreSQL and Redis are NOT exposed publicly.
# All inter-service communication is on the internal Docker network.
# Migration is a deliberate one-shot step — do NOT auto-run Alembic inside
# every app replica.
# =============================================================================

name: geo-tracker-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - geo_pg_data:/var/lib/postgresql/data
    # NO ports published — internal only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - geo_redis_data:/data
    # NO ports published — internal only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo-tracker:${GIT_SHA:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      APP_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
      # Trust the Nginx container as the forwarding proxy.
      # The Docker internal network typically uses 172.16.0.0/12.
      # Adjust to match your Docker network subnet if different.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    # NO host port mapping — Nginx proxies to app internally.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Derive the Host header from ALLOWED_HOSTS so the probe is
      # authorized by TrustedHostMiddleware in production.
      # IMPORTANT: $$ escaping is required so Docker Compose does NOT
      # interpolate these variables at config-render time.  They must be
      # evaluated INSIDE the container shell at healthcheck execution time.
      # Production fail-closed: if ALLOWED_HOSTS is empty, the healthcheck
      # must NOT fall back to localhost — it must fail.
      test:
        - CMD-SHELL
        - >-
          HOST=$$(printf '%s' "$$ALLOWED_HOSTS" | cut -d',' -f1 | tr -d ' ') &&
          [ -n "$$HOST" ] &&
          curl -fsS -H "Host: $$HOST" http://localhost:8000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo-tracker:${GIT_SHA:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      APP_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      python -m celery -A app.workers.celery_app:celery_app worker
      --loglevel=INFO --concurrency=1

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo-tracker:${GIT_SHA:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      APP_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # EXACTLY ONE beat instance (singleton).
    command: >
      python -m celery -A app.workers.celery_app:celery_app beat
      --loglevel=INFO

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo-tracker:${GIT_SHA:-latest}
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # One-shot migration command. Run via:
    #   docker compose -f docker-compose.prod.yml run --rm migrate
    command: ["python", "-m", "alembic", "upgrade", "head"]
    profiles:
      - migrate

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Use the Nginx-local liveness endpoint, not the app /health.
      # nginx:alpine does not include curl; use wget which is available.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  geo_pg_data:
  geo_redis_data:
